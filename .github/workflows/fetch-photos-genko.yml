# habi-genko の写真だけを取得する（共通の「写真を取得」が混んでいるとき用）。
# habi-genko/scripts/fetch-now.txt をプッシュすると動く。
name: 写真を取得（元寇）

on:
  push:
    paths:
      - 'habi-genko/scripts/fetch-now.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-photos-genko-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # イベント時点ではなく、ブランチの最新から始める（先に終わった取得の写真を使い回すため）
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: 写真を取得
        run: |
          for picks in habi-genko/scripts/photo-picks.json; do
            dir="$(dirname "$(dirname "$picks")")"
            echo "== $dir"
            python3 "$dir/scripts/fetch-photos.py" || echo "::warning::$dir で取得できなかった写真があります（credits.json と実行ログを確認）"
          done
      - name: コミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # 取得した写真を退避し、ブランチの最新に合わせてから足し込む（credits.json は両方を合わせる）
          mkdir -p "$RUNNER_TEMP/new"
          cp -r --parents habi-*/public/photos "$RUNNER_TEMP/new/"
          for i in 1 2 3 4 5; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset -q --hard "origin/${GITHUB_REF_NAME}"
            for dir in "$RUNNER_TEMP"/new/habi-*/public/photos; do
              dest="${dir#$RUNNER_TEMP/new/}"
              mkdir -p "$dest"
              cp -n "$dir"/*.jpg "$dest"/ 2>/dev/null || true
              python3 - "$dir/credits.json" "$dest/credits.json" <<'PY'
          import json, os, sys
          new, dest = sys.argv[1], sys.argv[2]
          if not os.path.exists(new):
              sys.exit(0)
          merged = json.load(open(dest)) if os.path.exists(dest) else {}
          for k, v in json.load(open(new)).items():
              merged.setdefault(k, v)
          json.dump(merged, open(dest, 'w'), ensure_ascii=False, indent=1)
          PY
            done
            git add habi-*/public/photos
            if git diff --cached --quiet; then echo "新しい写真はありません"; exit 0; fi
            git commit -q -m "写真を取得（GitHub Actions）"
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          exit 1
